<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* default colors (Purple) - replaced by The Universe's theme when it's there */
  :root{
    --bg:#120e1c; --bg2:#191327; --bg3:#211936; --border:#30264a;
    --text:#f1ecff; --muted:#9a8fb8; --accent:#a77bff;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0}
  body{
    background:var(--bg); color:var(--text);
    font:15px 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px; text-align:center; overflow:hidden;
  }
  /* same soft glow + faint grid as The Universe */
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none;
    background:
      radial-gradient(900px 500px at 50% -10%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%),
      linear-gradient(color-mix(in srgb, var(--text) 4%, transparent) 1px, transparent 1px) 0 0 / 52px 52px,
      linear-gradient(90deg, color-mix(in srgb, var(--text) 4%, transparent) 1px, transparent 1px) 0 0 / 52px 52px;
  }
  main{position:relative; max-width:720px}
  h1{
    margin:0; font-size:clamp(30px, 5vw, 58px); font-weight:700;
    letter-spacing:-.02em; line-height:1.12; white-space:pre-line;
    background:linear-gradient(115deg, var(--text) 15%, var(--accent) 95%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  p{margin:16px 0 0; font-size:15px; color:var(--muted); white-space:pre-line}
  p:empty{display:none}
</style>
<script>
/* ---------- theme: follow The Universe's active theme ---------- */
(function () {
  const KEY = "universe-active-theme", VARS = ["bg", "bg2", "bg3", "border", "text", "muted", "accent"];
  function read() {
    try { const t = JSON.parse(localStorage.getItem(KEY) || "null"); if (t && t.bg) return t; } catch {}
    try {  // fallback: read the colors straight off the parent page
      if (parent !== window) {
        const cs = getComputedStyle(parent.document.documentElement), t = {};
        VARS.forEach(k => t[k] = cs.getPropertyValue("--" + k).trim());
        if (t.bg) return t;
      }
    } catch {}
    return null;
  }
  function apply() {
    const t = read();
    if (!t || !VARS.every(k => typeof t[k] === "string" && t[k])) return;
    const root = document.documentElement;
    VARS.forEach(k => root.style.setProperty("--" + k, t[k]));
    const n = parseInt(String(t.bg).slice(1), 16) || 0;
    const lum = (0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255;
    root.style.colorScheme = lum > 0.5 ? "light" : "dark";
  }
  apply();
  addEventListener("storage", e => { if (e.key === KEY || e.key === null) apply(); });
})();
</script>
</head>
<body>
<main>
  <!-- ======================================================
       EDIT YOUR MESSAGE HERE.
       Big text goes in <h1>, the smaller line under it goes in <p>.
       Press Enter inside either one to start a new line.
       Leave the <p> empty to hide it.
       ====================================================== -->
  <h1>Getting a rework.</h1>
  <p>MIGHT comeback.</p>
</main>
</body>
</html>
